name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  # Migrations and the Edge Function go out before the site, so the site never runs ahead of them.
  # This workflow never runs for pull requests, so the secrets are not reachable from forks.
  supabase:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: gate
        run: |
          if [ -n "$SUPABASE_DB_URL" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase deploy skipped: secrets SUPABASE_DB_URL and SUPABASE_ACCESS_TOKEN are not both set."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.120.0
      # Idempotent: applies only migrations not yet recorded. Never pushes supabase/seed.sql.
      - if: steps.gate.outputs.run == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - if: steps.gate.outputs.run == 'true'
        run: supabase functions deploy admin-owner-link --project-ref lxcnmbcqdafhmhqimkgj --use-api

  build:
    needs: [ci, supabase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
