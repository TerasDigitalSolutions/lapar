name: Supabase deploy

# Ships migrations and the Edge Function to production (ARCHITECTURE 13). Never pushes supabase/seed.sql.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Check what to deploy
        id: plan
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_DB_URL or SUPABASE_ACCESS_TOKEN is not set; skipping the Supabase deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git rev-parse -q --verify HEAD^ >/dev/null \
            || ! git diff --quiet HEAD^ HEAD -- supabase/; then
            # shortcut: compares only the last commit of a push; a manual run covers anything older
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No change under supabase/; nothing to deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - if: steps.plan.outputs.run == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - if: steps.plan.outputs.run == 'true'
        run: supabase functions deploy admin-owner-link --project-ref lxcnmbcqdafhmhqimkgj
